; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;set default_envs to whichever board(s) you use. Build/Run/etc processes those envs
default_envs =
  esp32dev

[env]
; Global data for all [env:***]
framework = arduino
lib_ldf_mode = deep
; SensESP declares the unmaintained me-no-dev async stack: ESPAsyncTCP is the
; ESP8266 library (cannot compile on ESP32) and its "ESP Async WebServer" no
; longer resolves from the registry (ESPAsyncWebServer.h goes missing). Drop the
; ESP8266 lib and supply the maintained esphome forks — the modern ESP32 async
; stack also used by esp32-nmea2000 — pinned alongside espressif32 6.8.1.
lib_ignore =
  ESPAsyncTCP
monitor_speed = 115200
lib_deps =
  ; Peg the SensESP version to 2.0.0 and compatible versions
  mairas/ReactESP @ ^2.1.0
  SignalK/SensESP @ ^2.5.1
  AsyncTCP-esphome @ 2.0.1
  ottowinter/ESPAsyncWebServer-esphome @ 2.0.1
  ; Add any additional dependencies here
  ttlappalainen/NMEA2000-library
  ttlappalainen/NMEA2000_esp32
  ttlappalainen/NMEA0183
  bxparks/AceButton @ ^1.9.2
  https://github.com/ronzeiller/NMEA0183-AIS.git

[espressif32_base]
;this section has config items common to all ESP32 boards
; Pinned: the esphome async forks + SensESP 2.7.x build against the arduino-esp32
; 2.0.x core that espressif32 6.8.1 ships. Floating to latest (7.x / core 3.x)
; is what broke the me-no-dev async libs in the first place.
platform = espressif32 @ 6.8.1
build_unflags =
  -Werror=reorder
board_build.partitions = min_spiffs.csv
monitor_filters = esp32_exception_decoder

[env:esp32dev]
extends = espressif32_base
board = esp32dev
build_flags =
  -D SH_WG
  -D LED_BUILTIN=2
  ; Sailorwind submitter (additive, config-gated). Comment out to build the
  ; stock gateway firmware with no sailorwind code linked in.
  -D SW_SAILORWIND
  ; Uncomment the following to disable debug output altogether
  ;-D DEBUG_DISABLED
  ; Uncomment the following to enable the remote debug telnet interface on port 23
  ;-D REMOTE_DEBUG

;; Uncomment and change these if PlatformIO can't auto-detect the ports
;upload_port = /dev/tty.SLAB_USBtoUART
;monitor_port = /dev/tty.SLAB_USBtoUART

;; Uncomment the following lines to use Over-the-air (OTA) Updates
;upload_protocol = espota
;upload_port = IP_ADDRESS_OF_ESP_HERE
;upload_flags =
;  --auth=YOUR_OTA_PASSWORD
